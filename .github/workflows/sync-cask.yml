name: Sync Studio release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cask

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the cask from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-cask.py

      - name: Publish cask update
        run: |
          ruby -c Casks/labelize-studio.rb
          git diff --check
          if git diff --quiet -- Casks/labelize-studio.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks/labelize-studio.rb
          git commit -m 'Update Labelize Studio cask'
          git push origin HEAD:refs/heads/main
